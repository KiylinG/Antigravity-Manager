name: Build Windows Executable

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build PR-3913 Windows Installer
    runs-on: windows-2025

    steps:
      - name: Checkout PR-3913 Fix
        uses: actions/checkout@v4
        with:
          ref: pr-3913
          fetch-depth: 0

      - name: Verify Fix Commit
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "Checked out commit: $actual"
          if (-not $actual.StartsWith("59388d45")) {
            throw "Unexpected commit. Expected 59388d45."
          }

      - name: Rust Setup
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Disable Updater Artifacts Without Signing Key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            exit 0
          }
          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content -Raw $configPath | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 32 | Set-Content -Path $configPath -Encoding UTF8

      - name: Build Frontend
        run: npm run build

      - name: Build Windows NSIS Installer
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect Installer
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) {
            $files = @(Get-ChildItem "src-tauri/target/*/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
          }
          if ($files.Count -eq 0) {
            throw "No NSIS installer was generated."
          }
          New-Item -ItemType Directory -Force dist-artifacts | Out-Null
          foreach ($file in $files) {
            Copy-Item $file.FullName dist-artifacts/
          }
          Copy-Item $files[0].FullName "dist-artifacts/Antigravity-Manager-Setup.exe" -Force

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Manager-pr3913-Windows-Installer
          path: dist-artifacts/*.exe
          retention-days: 30